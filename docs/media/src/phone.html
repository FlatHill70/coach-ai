<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach phone capture</title>
<link rel="stylesheet" href="world.css">
<style>
  body { width: 560px; }
  #frame { position: relative; width: 560px; }
  .capture { position: absolute; left: 56px; top: 92px; padding: 9px; transform: rotate(-0.8deg); }
  .phone { width: 390px; height: 660px; overflow: hidden; position: relative; background: #1d1f22; color: #e3e6e9; font-family: "Hanken Grotesk", sans-serif; font-size: 15.5px; line-height: 1.5; }
  .chat { padding: 18px 18px 0; }
  .you { margin: 0 0 18px 56px; background: #303338; color: #f1f3f5; border-radius: 18px; padding: 10px 14px; font-size: 15px; line-height: 1.42; }
  .reply p, .reply ul, .reply ol, .reply pre, .reply h1, .reply h2, .reply h3 { margin: 0 0 12px; }
  .reply h1 { font-size: 21px; line-height: 1.25; font-weight: 700; color: #fff; }
  .reply h2 { font-size: 18px; line-height: 1.3; font-weight: 700; color: #fff; margin-top: 18px; }
  .reply strong { font-weight: 700; color: #fff; }
  .reply ul, .reply ol { padding-left: 22px; }
  .reply li { margin-bottom: 4px; }
  .reply li .mk { display: none; }
  .reply ul { list-style: disc; }
  .reply ol { list-style: decimal; }
  .reply code, .reply pre { font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .reply pre { background: #141619; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; }
  .composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px 16px; background: #1d1f22; border-top: 1px solid #2c2f33; }
  .composer div { border: 1px solid #3a3e44; border-radius: 22px; padding: 11px 16px; color: #8d949b; font-size: 15px; }
</style>
</head>
<body>
<div id="frame" class="surface"></div>
<script src="world.js"></script>
<script src="logpage.js"></script>
<script>
(async () => {
  const W = World;
  const M = window.__MEDIA__;
  const UI = { demo: "demo data", continues: "continues…", reply: "Reply to Claude…", cols: ["Date", "Exercise", "Sets", "Notes"], ...M.ui };
  if (M.lang) document.documentElement.lang = M.lang;
  W.theme();
  await W.ready();
  const frame = document.getElementById("frame");
  const cols = [50, 130, 330, 470];
  const SHEET_TOP = 92;

  const page = document.createElement("div");
  page.className = "page";
  Object.assign(page.style, { left: "0px", top: "0px", width: "560px", borderRadius: "0", boxShadow: "none" });
  frame.appendChild(page);

  const sheet = document.createElement("div");
  sheet.className = "sheet capture";
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  sheet.innerHTML = `<div class="phone"><div class="chat"><div class="you">${esc(M.prompt)}</div><div class="reply">${W.markdownBlocks(M.reply).join("")}</div></div><div class="composer"><div>${UI.reply}</div></div></div>`;
  page.appendChild(sheet);

  const H = SHEET_TOP + sheet.offsetHeight + 74;
  frame.style.height = H + "px";
  page.style.height = H + "px";
  document.body.style.height = H + "px";
  page.insertAdjacentHTML("afterbegin", W.grid(560, H, { cell: 14, row: 28, left: cols[0], top: 22 + 28 + 0, cols: cols.slice(1), headerTop: 22 + 0 }) + W.binding(H, { step: 22, start: 12 }));
  const put = (cls, text, x, y, size) => {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    Object.assign(el.style, { position: "absolute", left: x + "px", top: y + "px", fontSize: size + "px", lineHeight: "1", whiteSpace: "nowrap" });
    page.appendChild(el);
    return el;
  };
  UI.cols.forEach((t, i) => put("printed", t, cols[i] + 6, 30, 12));
  put("pencil", M.date, cols[0] + 6, 58, 17);
  put("pencil", M.label, cols[1] + 8, 58, 17);
  put("pencil soft", UI.demo, cols[3] + 8, 60, 14);
  W.tape(page, 40, SHEET_TOP - 10, -10, 80, 21);
  W.tape(page, 56 + 408 - 66, SHEET_TOP - 12, 8, 80, 22);
  put("pencil", UI.continues, 56 + 408 - 110, SHEET_TOP + sheet.offsetHeight + 24, 17);

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "ink");
  svg.setAttribute("width", 560);
  svg.setAttribute("height", H);
  page.appendChild(svg);
  const notes = document.createElement("div");
  notes.className = "notes";
  page.appendChild(notes);
  const phone = sheet.querySelector(".phone");
  const limitY = phone.getBoundingClientRect().bottom - 70;
  const marks = (M.marks || []).filter(() => true);
  const placed = W.annotate(page, sheet.querySelector(".reply"), svg, notes, marks, { notesX: cols[3] + 22, tipX: 56 + 408 + 6, noteSize: 18, ink: 2.6, seed: M.seed || 211 });
  window.__RESULT__ = { placed, height: H, limitY };
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
