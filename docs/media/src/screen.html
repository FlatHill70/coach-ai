<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach conversation capture</title>
<link rel="stylesheet" href="world.css">
<style>
  body { width: 800px; }
  #frame { position: relative; width: 800px; }
  .capture { position: absolute; left: 70px; width: 572px; padding: 12px; transform-origin: 50% 0; }
  .term .prompt { margin-bottom: 16px; }
  .cont { position: absolute; font-size: 17px; }
</style>
</head>
<body>
<div id="frame" class="surface"></div>
<script src="world.js"></script>
<script src="logpage.js"></script>
<script>
(async () => {
  const W = World;
  const M = window.__MEDIA__;
  W.theme();
  await W.ready();
  const frame = document.getElementById("frame");
  const MAXH = M.maxHeight || 1100;
  const SHEET_TOP = 112;
  frame.style.height = MAXH + "px";

  const cols = [58, 150, 470, 652];
  const page = document.createElement("div");
  page.className = "page";
  Object.assign(page.style, { left: "0px", top: "0px", width: "800px", height: MAXH + "px", borderRadius: "0", boxShadow: "none" });
  frame.appendChild(page);

  const sheet = document.createElement("div");
  sheet.className = "sheet capture";
  sheet.style.top = SHEET_TOP + "px";
  const term = document.createElement("div");
  term.className = "term";
  term.innerHTML = `<div class="prompt"><b>&gt; </b>${M.prompt.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>`;
  sheet.appendChild(term);
  page.appendChild(sheet);

  const body = document.createElement("div");
  term.appendChild(body);
  const blocks = W.markdownBlocks(M.reply);
  const limit = MAXH - SHEET_TOP - 24 - 70;
  let truncated = false;
  for (let i = 0; i < blocks.length; i++) {
    body.insertAdjacentHTML("beforeend", blocks[i]);
    if (term.offsetHeight > limit) { body.lastElementChild.remove(); truncated = true; break; }
  }
  const leadIn = (el) => el && (/^H[1-3]$/.test(el.tagName) || (el.tagName === "P" && el.children.length === 1 && el.children[0].tagName === "STRONG" && el.textContent.trim() === el.children[0].textContent.trim()));
  while (truncated && leadIn(body.lastElementChild)) body.lastElementChild.remove();
  if (body.lastElementChild) body.lastElementChild.style.marginBottom = "0";

  const H = Math.ceil(SHEET_TOP + sheet.offsetHeight + (truncated ? 78 : 54));
  frame.style.height = H + "px";
  page.style.height = H + "px";
  document.body.style.height = H + "px";

  page.insertAdjacentHTML("afterbegin", W.grid(800, H, { cell: 14, row: 28, left: cols[0], top: 56 + 28, cols: cols.slice(1), headerTop: 56 }) + W.binding(H, { step: 22, start: 12 }));
  const put = (cls, text, x, y, size) => {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    Object.assign(el.style, { position: "absolute", left: x + "px", top: y + "px", fontSize: size + "px", lineHeight: "1", whiteSpace: "nowrap" });
    page.appendChild(el);
    return el;
  };
  ["Date", "Exercise", "Sets", "Notes"].forEach((t, i) => put("printed", t, cols[i] + 6, 64, 12.5));
  put("pencil", M.date, cols[0] + 6, 26, 19);
  put("pencil", M.label, cols[1] + 8, 26, 19);
  put("pencil soft", "demo data", cols[3] + 18, 28, 16);

  sheet.style.transform = `rotate(${M.tilt || -0.5}deg)`;
  W.tape(page, 52, SHEET_TOP - 12, -9, 86, 11);
  W.tape(page, 70 + 572 - 70, SHEET_TOP - 10, 7, 86, 12);
  if (truncated) {
    const c = put("pencil", "continues…", 70 + 572 - 120, SHEET_TOP + sheet.offsetHeight + 22, 19);
    c.classList.add("cont");
  }

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "ink");
  svg.setAttribute("width", 800);
  svg.setAttribute("height", H);
  page.appendChild(svg);
  const notes = document.createElement("div");
  notes.className = "notes";
  page.appendChild(notes);
  const placed = W.annotate(page, term, svg, notes, M.marks || [], { notesX: cols[3] + 44, tipX: 70 + 572 + 6, noteSize: 21, ink: 3, seed: M.seed || 101 });
  window.__RESULT__ = { truncated, placed, height: H };
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
