<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach demo</title>
<link rel="stylesheet" href="world.css">
<style>
  body { width: 960px; height: 540px; }
  #frame { width: 960px; height: 540px; }
  .side { position: absolute; left: 612px; top: 0; width: 330px; height: 540px; }
  .wordmark { position: absolute; left: 0; top: 96px; font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 132px; line-height: 0.82; letter-spacing: -0.01em; color: var(--surface-ink); }
  .line { position: absolute; left: 2px; top: 222px; width: 300px; font-family: "Hanken Grotesk", sans-serif; font-size: 17px; line-height: 1.4; color: var(--surface-ink-soft); text-wrap: balance; }
  .strip-wrap { position: absolute; left: -4px; top: 340px; }
  .strip { position: relative; padding: 11px 16px 10px 16px; transform: rotate(1.6deg); font-family: "JetBrains Mono", monospace; font-size: 10.6px; color: #1d2226; white-space: nowrap; }
</style>
</head>
<body>
<div id="frame" class="surface"></div>
<script src="world.js"></script>
<script src="logpage.js"></script>
<script>
(async () => {
  const W = World;
  const M = window.__MEDIA__;
  if (M.lang) document.documentElement.lang = M.lang;
  const theme = W.theme();
  await W.ready();
  const frame = document.getElementById("frame");
  W.paint(frame, theme, 3307);

  const L = { x: 30, y: -62, w: 562, h: 680, top: 120, headH: 26, rowH: 27, cols: [50, 134, 280, 436], font: 16, printSize: 11, noteSize: 18, ink: 2.9, bindStep: 21, gapRows: 1 };
  const log = W.logPage(frame, M.week, L);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "ink");
  svg.setAttribute("width", L.w);
  svg.setAttribute("height", L.h);
  log.page.appendChild(svg);
  const notes = document.createElement("div");
  notes.className = "notes";
  log.page.appendChild(notes);
  const marks = W.correct(log, svg, notes, M.corrections.map((c) => ({ ...c, dx: 10 })), L, 5150);
  log.page.style.transform = "rotate(-2deg)";

  const side = document.createElement("div");
  side.className = "side";
  side.innerHTML = `<div class="wordmark">Coach</div><p class="line">${M.tagline}</p><div class="strip-wrap"><div class="sheet strip">${M.install}</div></div>`;
  frame.appendChild(side);
  const wrap = side.querySelector(".strip-wrap");
  const strip = side.querySelector(".strip");
  const t1 = W.tape(wrap, -34, -6, -12, 54, 91);
  const t2 = W.tape(wrap, strip.offsetWidth - 20, 24, -9, 50, 92);

  let t = 500;
  log.header.forEach((el) => { W.writeOn(el, t, 300); t += 260; });
  t += 250;
  log.rows.forEach((r) => {
    r.els.forEach((el, k) => { W.writeOn(el, t + k * 120, el === r.sets ? 260 : 200); });
    t += 380;
  });
  t += 450;
  marks.forEach((m) => {
    W.drawOn(m.paths[0], t, 460); t += 420;
    W.drawOn(m.paths[1], t, 300); t += 260;
    W.drawOn(m.paths[2], t, 120); t += 100;
    W.writeOn(m.note, t, 380); t += 520;
  });
  t += 150;
  strip.animate([{ opacity: 0, transform: "translateY(-14px) rotate(-1deg)" }, { opacity: 1, transform: "translateY(0) rotate(1.6deg)" }], { duration: 420, delay: t, fill: "both", easing: "cubic-bezier(.16,1,.3,1)" });
  [t1, t2].forEach((tp, i) => tp.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay: t + 380 + i * 120, fill: "both" }));
  t += 700;
  window.__DEMO__ = { duration: t + 2100 };
  document.getAnimations().forEach((a) => { a.pause(); a.currentTime = 0; });
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
